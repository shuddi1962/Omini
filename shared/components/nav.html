  Usage: Include this file in your HTML pages
  Required: shared/styles.css, shared/tailwind.config.js
-->
<header class="top-nav">
  <div class="flex items-center gap-8">
    <span class="font-headline-md text-headline-md font-bold text-on-primary">OmniPlatform</span>
    <nav class="hidden md:flex gap-6 items-center h-full pt-1">
      <a class="font-body-md text-body-md text-on-primary/80 hover:bg-primary-container/20 transition-colors h-16 flex items-center px-2" href="#">Dashboard</a>
      <a class="font-body-md text-body-md text-on-primary/80 hover:bg-primary-container/20 transition-colors h-16 flex items-center px-2" href="#">Ecosystem</a>
      <a class="font-body-md text-body-md text-on-primary/80 hover:bg-primary-container/20 transition-colors h-16 flex items-center px-2" href="#">Integrations</a>
    </nav>
  </div>
  <div class="flex items-center gap-4">
    <!-- Search -->
    <button class="text-on-primary/80 hover:text-on-primary transition-colors">
      <span class="material-symbols-outlined">search</span>
    </button>
    <!-- Notifications -->
    <button class="text-on-primary/80 hover:text-on-primary transition-colors relative">
      <span class="material-symbols-outlined">notifications</span>
      <span class="absolute -top-1 -right-1 w-2 h-2 bg-secondary rounded-full animate-pulse-red"></span>
    </button>
    <!-- Settings -->
    <button class="text-on-primary/80 hover:text-on-primary transition-colors">
      <span class="material-symbols-outlined">settings</span>
    </button>
    <!-- User Avatar -->
    <div class="w-8 h-8 rounded-full bg-secondary flex items-center justify-center">
      <span class="text-on-secondary font-body-sm font-semibold">JD</span>
    </div>
