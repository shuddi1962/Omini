<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Page Title | OmniPlatform</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono&display=swap" rel="stylesheet"/>
  
  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Tailwind Config -->
  <script src="../shared/tailwind.config.js"></script>
  
  <!-- Supabase Client -->
  <script src="../shared/supabase-client.js"></script>
  
  <!-- Shared Styles -->
  <link rel="stylesheet" href="../shared/styles.css"/>
</head>
<body class="bg-surface text-text-main antialiased overflow-x-hidden">
  
  <!-- Top Navigation (from shared/components/nav.html) -->
  <header class="top-nav">
    <div class="flex items-center gap-8">
      <span class="font-headline-md text-headline-md font-bold text-on-primary">OmniPlatform</span>
      <nav class="hidden md:flex gap-6 items-center h-full pt-1">
        <a class="font-body-md text-body-md text-secondary border-b-2 border-secondary h-16 flex items-center px-2 transition-colors" href="#">Dashboard</a>
        <a class="font-body-md text-body-md text-on-primary/80 hover:bg-primary-container/20 transition-colors h-16 flex items-center px-2" href="#">Ecosystem</a>
        <a class="font-body-md text-body-md text-on-primary/80 hover:bg-primary-container/20 transition-colors h-16 flex items-center px-2" href="#">Integrations</a>
      </nav>
    </div>
    <div class="flex items-center gap-4">
      <button class="text-on-primary/80 hover:text-on-primary transition-colors">
        <span class="material-symbols-outlined">search</span>
      </button>
      <button class="text-on-primary/80 hover:text-on-primary transition-colors relative">
        <span class="material-symbols-outlined">notifications</span>
      </button>
      <div class="w-8 h-8 rounded-full bg-secondary flex items-center justify-center">
        <span class="text-on-secondary font-body-sm font-semibold">JD</span>
      </div>
    </div>
  </header>

  <!-- Sidebar (from shared/components/sidebar.html) -->
  <aside class="fixed left-0 top-16 w-64 h-[calc(100vh-64px)] bg-surface-container-low border-r border-subtle p-4 flex flex-col gap-1 overflow-y-auto">
    <a href="#" class="sidebar-nav-item active">
      <span class="material-symbols-outlined">dashboard</span>
      <span class="font-body-md">Dashboard</span>
    </a>
    <a href="#" class="sidebar-nav-item">
      <span class="material-symbols-outlined">inbox</span>
      <span class="font-body-md">Inbox</span>
    </a>
    <!-- Add more sidebar items as needed -->
  </aside>

  <!-- Main Content Area -->
  <main class="ml-64 pt-16 min-h-screen">
    <div class="p-6">
      <!-- Page content goes here -->
      <h1 class="font-headline-lg text-headline-lg font-semibold text-text-main mb-6">Page Title</h1>
      
      <!-- Example stat cards -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-6">
        <div class="stat-card">
          <p class="font-label-md text-text-muted mb-2">METRIC</p>
          <p class="font-display-lg-mobile font-bold text-text-main">1,234</p>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
